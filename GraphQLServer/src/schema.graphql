
#Syncfusion DataManager query params

input DataManager {
    skip: Int
    take: Int
    group: [String]
    table: String
    select: [String]
    where: String
    search: String
    requiresCounts: Boolean
    params: String
}

input AppointmentFields {
  Id: Int!
  Subject: String
  StartTime: String!
  EndTime: String!
  Location: String
  IsAllDay: Boolean
  Guid: String
  RecurrenceRule: String
  StartTimezone: String
  EndTimezone: String
  RecurrenceID: Int
  RecurrenceException: String
  FollowingID: Int
  IsReadonly:String
  IsBlock:String
}

type Appointment {
  Id: Int!
  Subject: String
  StartTime: String!
  EndTime: String!
  Location: String
  IsAllDay: Boolean
  RecurrenceRule: String
  StartTimezone: String
  EndTimezone: String
  RecurrenceID: Int
  RecurrenceException: String
  FollowingID: Int
  IsReadonly:String
  IsBlock:String
}

type ReturnType {
  result: [Appointment]
}

type Query {
  getEvents(datamanager: DataManager): ReturnType
}

type Mutation {
  batchUpdate(added: [AppointmentFields],changed: [AppointmentFields],deleted: [AppointmentFields]): [Appointment]
}